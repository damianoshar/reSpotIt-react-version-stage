apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Embedded librespot player (Rust/JNI) + the on-device playback session.
//
// The native libraries in src/main/jniLibs/<abi>/libspotify_librespot.so are
// built from rust/ with cargo-ndk. They are intentionally git-ignored; see
// README.md for the exact build command.
android {
    namespace "com.spotifydashboard.librespot"
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
}
