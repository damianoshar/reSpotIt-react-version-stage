[package]
name = "spotify_librespot"
version = "0.1.0"
edition = "2021"
publish = false

# The shared library is loaded by Kotlin via System.loadLibrary("spotify_librespot")
# => libspotify_librespot.so in jniLibs/<abi>/
[lib]
name = "spotify_librespot"
crate-type = ["cdylib"]

[dependencies]
# Android-safe feature set:
#  - NO native-tls  (needs OpenSSL; we use rustls with webpki roots)
#  - NO rodio-backend (needs cpal/ALSA/JACK; we provide a custom PCM sink -> AudioTrack)
#  - NO with-libmdns (mDNS discovery not needed for token-based login)
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

# JNI surface for Kotlin (M2). tokio for the session runtime (librespot's Player
# spawns its own runtime internally).
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
log = "0.4.34"
android_logger = "0.15.1"
base64 = "0.23.1"
librespot-protocol = "0.8.0"
# Stable Spotify Connect device id, derived from the device name the same way
# the librespot binary does (`sha1(name)`), so reconnects reuse one device.
sha1 = "0.10"
hex = "0.4"

# librespot-core is vendored (vendor/librespot-core) with a one-line patch that makes the
# whole "identity chain" present librespot's Linux/desktop profile on Android: since
# Spotify's 2026-08 change, login5 (playback auth) only accepts credentials derived from
# the desktop (keymaster) client id, and the server cross-checks UA, client-token id,
# version strings and AP auth Os for consistency. See vendor/.../config.rs and PROGRESS.md.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
# tempfile is vendored (vendor/tempfile) with a 32-bit-Android-only patch: skip the
# `rustix::fs::fstat` identity check in `NamedTempFile::reopen`, because rustix uses
# the `statx` syscall there and some Android 9 OEM seccomp policies SIGSYS it.
tempfile = { path = "vendor/tempfile" }

# Built with:
#   cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../src/main/jniLibs build --release
# from audio-librespot/rust
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
